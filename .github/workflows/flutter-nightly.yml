name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      cashier_api_base_url:
        description: "Your cashier management API URL, for example https://api.example.com"
        required: true
        type: string

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      cashier_api_base_url: ${{ inputs.cashier_api_base_url }}
