name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      cashier_api_base_url:
        description: "Your cashier management API URL, for example https://api.example.com"
        required: true
        type: string
  push:
    branches:
      - codex/cashier-remote-integration
    paths:
      - "src/cashier_remote.rs"
      - "src/core_main.rs"
      - ".github/workflows/flutter-build.yml"
      - ".github/workflows/flutter-nightly.yml"

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      cashier_api_base_url: ${{ inputs.cashier_api_base_url || 'https://guocifang.cn/api' }}
